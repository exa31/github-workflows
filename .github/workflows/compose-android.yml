name: Kotlin Android (Jetpack Compose) Build & Play Store Deploy

on:
  workflow_dispatch:
    inputs:
      env_content:
        description: "Content to write to .env file (e.g. key=value lines)"
        required: false
        default: ""
        type: string
      app_name:
        description: "Application Name"
        required: true
        type: string
      java_version:
        description: "Java JDK Version (17 or 21)"
        required: false
        default: "17"
        type: string
      module_name:
        description: "Android App Module Name (usually 'app')"
        required: false
        default: "app"
        type: string
      gradle_task_apk:
        description: "Gradle Task for APK Build"
        required: false
        default: "assembleRelease"
        type: string
      gradle_task_bundle:
        description: "Gradle Task for App Bundle Build"
        required: false
        default: "bundleRelease"
        type: string
      build_type:
        description: "Build Output: appbundle, apk, or both"
        required: false
        default: "both"
        type: string
      attach_to_release:
        description: "Attach APK and AAB binaries to GitHub Release"
        required: false
        default: true
        type: boolean
      enable_semantic_release:
        description: "Run Semantic Release for automated version tagging and GitHub release"
        required: false
        default: true
        type: boolean
      update_gradle_version:
        description: "Auto-bump version in build.gradle / build.gradle.kts and commit back to repository"
        required: false
        default: true
        type: boolean
      build_name:
        description: "App Version Name override (e.g. 1.0.0). Defaults to semantic release tag"
        required: false
        default: ""
        type: string
      build_number:
        description: "App Version Code override (integer). Defaults to github.run_number"
        required: false
        default: ""
        type: string
      build_args:
        description: "Additional gradle build arguments (e.g. --stacktrace)"
        required: false
        default: ""
        type: string
      package_name:
        description: "Android Package Name (required for Google Play Deploy, e.g. com.company.app)"
        required: false
        default: ""
        type: string
      upload_to_play_store:
        description: "Deploy to Google Play Console"
        required: false
        default: true
        type: boolean
      track:
        description: "Google Play Track: internal, alpha, beta, production"
        required: false
        default: "internal"
        type: string
      status:
        description: "Google Play Release Status: completed, draft, inProgress, halted"
        required: false
        default: "completed"
        type: string
      tag_prefix:
        description: "Git Tag Prefix for Monorepo (e.g. 'android-')"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      env_content:
        description: "Content to write to .env file (e.g. key=value lines)"
        required: false
        default: ""
        type: string
      app_name:
        description: "Application Name"
        required: true
        type: string
      java_version:
        description: "Java JDK Version (17 or 21)"
        required: false
        default: "17"
        type: string
      module_name:
        description: "Android App Module Name (usually 'app')"
        required: false
        default: "app"
        type: string
      gradle_task_apk:
        description: "Gradle Task for APK Build"
        required: false
        default: "assembleRelease"
        type: string
      gradle_task_bundle:
        description: "Gradle Task for App Bundle Build"
        required: false
        default: "bundleRelease"
        type: string
      build_type:
        description: "Build Output: appbundle, apk, or both"
        required: false
        default: "both"
        type: string
      attach_to_release:
        description: "Attach APK and AAB binaries to GitHub Release"
        required: false
        default: true
        type: boolean
      enable_semantic_release:
        description: "Run Semantic Release for automated version tagging and GitHub release"
        required: false
        default: true
        type: boolean
      update_gradle_version:
        description: "Auto-bump version in build.gradle / build.gradle.kts and commit back to repository"
        required: false
        default: true
        type: boolean
      build_name:
        description: "App Version Name override (e.g. 1.0.0). Defaults to semantic release tag"
        required: false
        default: ""
        type: string
      build_number:
        description: "App Version Code override (integer). Defaults to github.run_number"
        required: false
        default: ""
        type: string
      build_args:
        description: "Additional gradle build arguments (e.g. --stacktrace)"
        required: false
        default: ""
        type: string
      package_name:
        description: "Android Package Name (required for Google Play Deploy, e.g. com.company.app)"
        required: false
        default: ""
        type: string
      upload_to_play_store:
        description: "Deploy to Google Play Console"
        required: false
        default: true
        type: boolean
      track:
        description: "Google Play Track: internal, alpha, beta, production"
        required: false
        default: "internal"
        type: string
      status:
        description: "Google Play Release Status: completed, draft, inProgress, halted"
        required: false
        default: "completed"
        type: string
      tag_prefix:
        description: "Git Tag Prefix for Monorepo (e.g. 'android-')"
        required: false
        default: ""
        type: string

    secrets:
      ENV_FILE:
        description: "Encrypted .env content from GitHub Secrets"
        required: false
      ANDROID_KEYSTORE_BASE64:
        description: "Base64 encoded upload keystore .jks file"
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: "Keystore password"
        required: true
      ANDROID_KEY_ALIAS:
        description: "Key alias"
        required: true
      ANDROID_KEY_PASSWORD:
        description: "Key password"
        required: true
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        description: "Google Play Console Service Account JSON Key (content in plain text or base64)"
        required: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: deploy-android-compose-${{ inputs.app_name }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Compose (AAB / APK)
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.versioning.outputs.build_name }}
      build_number: ${{ steps.versioning.outputs.build_number }}
      release_tag: ${{ steps.versioning.outputs.release_tag }}

    steps:
      #################################################
      # Checkout Repository
      #################################################
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #################################################
      # Setup Node (Semantic Release)
      #################################################
      - name: Setup Node (Semantic Release)
        if: ${{ inputs.enable_semantic_release }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #################################################
      # Install Semantic Release
      #################################################
      - name: Install Semantic Release
        if: ${{ inputs.enable_semantic_release }}
        run: |
          npm install -D \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      #################################################
      # Run Semantic Release
      #################################################
      - name: Run Semantic Release
        if: ${{ inputs.enable_semantic_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.tag_prefix }}" ]; then
            npx semantic-release --tag-format "${{ inputs.tag_prefix }}v\${version}" || echo "Semantic release completed or skipped without new version."
          else
            npx semantic-release || echo "Semantic release completed or skipped without new version."
          fi

      #################################################
      # Setup Java JDK
      #################################################
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java_version }}

      #################################################
      # Setup Gradle Cache
      #################################################
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      #################################################
      # Setup Environment Configuration (.env)
      #################################################
      - name: Setup Environment Configuration (.env)
        env:
          ENV_CONTENT: ${{ inputs.env_content }}
          SECRET_ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$SECRET_ENV_CONTENT" ]; then
            echo "📄 Writing .env from secret ENV_FILE..."
            echo "$SECRET_ENV_CONTENT" > .env
          elif [ -n "$ENV_CONTENT" ]; then
            echo "📄 Writing .env from inputs.env_content..."
            echo "$ENV_CONTENT" > .env
          elif [ -f .env.example ]; then
            echo "📄 Writing .env from .env.example template..."
            cp .env.example .env
          else
            echo "📄 Creating empty .env placeholder..."
            touch .env
          fi

          # Salin juga ke module jika folder module ada (misal: app/)
          if [ -d "${{ inputs.module_name }}" ]; then
            cp .env "${{ inputs.module_name }}/.env"
          fi

      #################################################
      # Setup Android Keystore & Signing Configuration
      #################################################
      - name: Setup Keystore & Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MODULE="${{ inputs.module_name }}"
          mkdir -p "$MODULE"

          # Decode Keystore ke module dan root
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MODULE/upload-keystore.jks"
          cp "$MODULE/upload-keystore.jks" upload-keystore.jks

          # Create keystore.properties & key.properties untuk fleksibilitas build gradle
          cat <<EOF > keystore.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          cp keystore.properties key.properties
          cp keystore.properties "$MODULE/keystore.properties"
          cp keystore.properties "$MODULE/key.properties"

          echo "KEYSTORE_FILE=upload-keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

          echo "✅ Keystore and signing properties created successfully in root and $MODULE/."

      #################################################
      # Make Gradle Wrapper Executable
      #################################################
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      #################################################
      # Determine Version & Build Number
      #################################################
      - name: Calculate Version and Build Number
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true

          # 1. Version Name (Semver)
          if [ -n "${{ inputs.build_name }}" ]; then
            BUILD_NAME="${{ inputs.build_name }}"
          else
            if [ -n "${{ inputs.tag_prefix }}" ]; then
              RAW_TAG=$(git describe --tags --match "${{ inputs.tag_prefix }}v*" --abbrev=0 2>/dev/null || echo "")
              if [ -n "$RAW_TAG" ]; then
                PREFIX="${{ inputs.tag_prefix }}v"
                BUILD_NAME="${RAW_TAG#$PREFIX}"
              else
                DETECTED_VER=$(grep -E 'versionName\s*=?\s*["'\'']' ${{ inputs.module_name }}/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*versionName\s*=?\s*["'\'']([^"'\'']+)["'\''].*/\1/' || echo "")
                BUILD_NAME="${DETECTED_VER:-1.0.0}"
              fi
            else
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -n "$LATEST_TAG" ]; then
                BUILD_NAME="${LATEST_TAG#v}"
              else
                # Cari dari build.gradle.kts / build.gradle jika ada
                DETECTED_VER=$(grep -E 'versionName\s*=?\s*["'\'']' ${{ inputs.module_name }}/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*versionName\s*=?\s*["'\'']([^"'\'']+)["'\''].*/\1/' || echo "")
                BUILD_NAME="${DETECTED_VER:-1.0.0}"
              fi
            fi
          fi

          # 2. Version Code (Integer)
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          TAG="${{ inputs.tag_prefix }}v${BUILD_NAME}"

          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "🚀 Build Name: $BUILD_NAME, Build Number (Version Code): $BUILD_NUMBER, Release Tag: $TAG"

      #################################################
      # Auto-bump Gradle Version & Commit
      #################################################
      - name: Update Gradle Version and Commit
        if: ${{ inputs.update_gradle_version }}
        env:
          BUILD_NAME: ${{ steps.versioning.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_number }}
        run: |
          MODULE="${{ inputs.module_name }}"
          UPDATED=false

          # 1. Cek app/build.gradle.kts
          if [ -f "$MODULE/build.gradle.kts" ]; then
            echo "📝 Checking $MODULE/build.gradle.kts..."
            sed -i.bak -E "s/(versionCode\s*=\s*)[0-9]+/\1${BUILD_NUMBER}/g" "$MODULE/build.gradle.kts"
            sed -i.bak -E "s/(versionName\s*=\s*\")[^\"]+(\")/\1${BUILD_NAME}\2/g" "$MODULE/build.gradle.kts"
            rm -f "$MODULE/build.gradle.kts.bak"
            UPDATED=true
          fi

          # 2. Cek app/build.gradle (Groovy)
          if [ -f "$MODULE/build.gradle" ]; then
            echo "📝 Checking $MODULE/build.gradle..."
            sed -i.bak -E "s/(versionCode\s+)[0-9]+/\1${BUILD_NUMBER}/g" "$MODULE/build.gradle"
            sed -i.bak -E "s/(versionName\s+\")[^\"]+(\")/\1${BUILD_NAME}\2/g" "$MODULE/build.gradle"
            rm -f "$MODULE/build.gradle.bak"
            UPDATED=true
          fi

          # 3. Cek gradle.properties
          if [ -f "gradle.properties" ]; then
            if grep -q "versionCode=" gradle.properties; then
              sed -i.bak -E "s/^(versionCode=).*/\1${BUILD_NUMBER}/" gradle.properties
            fi
            if grep -q "versionName=" gradle.properties; then
              sed -i.bak -E "s/^(versionName=).*/\1${BUILD_NAME}/" gradle.properties
            fi
            rm -f gradle.properties.bak
            UPDATED=true
          fi

          if [ "$UPDATED" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            MODIFIED_FILES=$(git status --porcelain | grep -E "build\.gradle|gradle\.properties" | awk '{print $2}' || true)
            if [ -n "$MODIFIED_FILES" ]; then
              echo "📝 Committing updated version files: $MODIFIED_FILES"
              git add $MODIFIED_FILES
              git commit -m "chore(release): bump version to ${BUILD_NAME} (${BUILD_NUMBER}) [skip ci]"
              
              BRANCH_NAME="${{ github.ref_name }}"
              if [ -n "$BRANCH_NAME" ]; then
                git pull --rebase origin "$BRANCH_NAME" 2>/dev/null || true
                git push origin HEAD:"$BRANCH_NAME" || echo "⚠️ Could not push to $BRANCH_NAME (branch may be protected), continuing build."
              fi
            else
              echo "ℹ️ Version files are already up-to-date (${BUILD_NAME} / ${BUILD_NUMBER})."
            fi
          fi

      #################################################
      # Build Android App Bundle (AAB)
      #################################################
      - name: Build Android App Bundle (.aab)
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        env:
          BUILD_NAME: ${{ steps.versioning.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "📦 Building Release Bundle with task: ${{ inputs.gradle_task_bundle }}..."
          ./gradlew ${{ inputs.gradle_task_bundle }} \
            -PversionCode="${BUILD_NUMBER}" \
            -PversionName="${BUILD_NAME}" \
            -Pandroid.injected.signing.store.file="upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
            ${{ inputs.build_args }}

      #################################################
      # Build Android APK
      #################################################
      - name: Build Android APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        env:
          BUILD_NAME: ${{ steps.versioning.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "📱 Building Release APK with task: ${{ inputs.gradle_task_apk }}..."
          ./gradlew ${{ inputs.gradle_task_apk }} \
            -PversionCode="${BUILD_NUMBER}" \
            -PversionName="${BUILD_NAME}" \
            -Pandroid.injected.signing.store.file="upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
            ${{ inputs.build_args }}

      #################################################
      # Upload Artifacts to GitHub Actions
      #################################################
      - name: Upload AAB Artifact
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-v${{ steps.versioning.outputs.build_name }}-${{ steps.versioning.outputs.build_number }}-aab
          path: "**/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK Artifact
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-v${{ steps.versioning.outputs.build_name }}-${{ steps.versioning.outputs.build_number }}-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 30

      #################################################
      # Attach APK & AAB to GitHub Release
      #################################################
      - name: Attach Assets to GitHub Release
        if: ${{ inputs.attach_to_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.release_tag }}"
          echo "🏷️ Target Release Tag: $TAG"

          FILES_TO_UPLOAD=()

          # 1. Cari APK dan buat salinan dengan nama yang rapi
          APK_FOUND=$(find . -path "*/build/outputs/apk/release/*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_FOUND" ] && [ -f "$APK_FOUND" ]; then
            APK_DIR=$(dirname "$APK_FOUND")
            NEW_APK="${APK_DIR}/${{ inputs.app_name }}-v${{ steps.versioning.outputs.build_name }}-${{ steps.versioning.outputs.build_number }}.apk"
            if [ "$APK_FOUND" != "$NEW_APK" ]; then
              cp "$APK_FOUND" "$NEW_APK"
            fi
            FILES_TO_UPLOAD+=("$NEW_APK")
          fi

          # 2. Cari AAB dan buat salinan dengan nama yang rapi
          AAB_FOUND=$(find . -path "*/build/outputs/bundle/release/*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_FOUND" ] && [ -f "$AAB_FOUND" ]; then
            AAB_DIR=$(dirname "$AAB_FOUND")
            NEW_AAB="${AAB_DIR}/${{ inputs.app_name }}-v${{ steps.versioning.outputs.build_name }}-${{ steps.versioning.outputs.build_number }}.aab"
            if [ "$AAB_FOUND" != "$NEW_AAB" ]; then
              cp "$AAB_FOUND" "$NEW_AAB"
            fi
            FILES_TO_UPLOAD+=("$NEW_AAB")
          fi

          if [ ${#FILES_TO_UPLOAD[@]} -eq 0 ]; then
            echo "ℹ️ Tidak ada file APK atau AAB yang ditemukan untuk di-upload."
            exit 0
          fi

          echo "📦 Menyiapkan upload file: ${FILES_TO_UPLOAD[*]}"

          # Cek apakah release tag sudah dibuat oleh semantic-release di awal
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ GitHub Release $TAG ditemukan. Mengupload file aset..."
            gh release upload "$TAG" "${FILES_TO_UPLOAD[@]}" --clobber
          else
            echo "ℹ️ Release $TAG belum ada di GitHub. Membuat release baru dengan tag $TAG..."
            gh release create "$TAG" "${FILES_TO_UPLOAD[@]}" \
              --title "${{ inputs.app_name }} $TAG" \
              --notes "Automated release build for ${{ inputs.app_name }} $TAG" || true
          fi

      #################################################
      # Build Step Summary
      #################################################
      - name: Generate Android Build Summary
        if: always()
        run: |
          echo "## 🤖 Kotlin Android (Jetpack Compose) Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | \`${{ inputs.app_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Module Name** | \`${{ inputs.module_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`${{ steps.versioning.outputs.build_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Code** | \`${{ steps.versioning.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | \`${{ inputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Version** | \`${{ inputs.java_version }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_type }}" == "apk" ] || [ "${{ inputs.build_type }}" == "both" ]; then
            echo "| **Direct Download APK** | [📱 Download APK via GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.versioning.outputs.release_tag }}) |" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-play-store:
    name: Deploy to Google Play Console
    needs: build-android
    if: ${{ inputs.upload_to_play_store }}
    runs-on: ubuntu-latest

    steps:
      #################################################
      # Download AAB Artifact
      #################################################
      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_name }}-v${{ needs.build-android.outputs.build_name }}-${{ needs.build-android.outputs.build_number }}-aab
          path: release-bundle

      #################################################
      # Prepare Google Play Service Account
      #################################################
      - name: Prepare Google Play Service Account
        id: play_auth
        env:
          SERVICE_ACCOUNT_RAW: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_RAW" ]; then
            echo "⚠️ PLAY_STORE_SERVICE_ACCOUNT_JSON is not configured. Skipping Play Store deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir -p $RUNNER_TEMP
          SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/service_account.json"

          # Check if input is base64 encoded or plain text json
          if echo "$SERVICE_ACCOUNT_RAW" | grep -q '^{'; then
            echo "$SERVICE_ACCOUNT_RAW" > "$SERVICE_ACCOUNT_FILE"
          else
            echo "$SERVICE_ACCOUNT_RAW" | base64 --decode > "$SERVICE_ACCOUNT_FILE"
          fi

          echo "sa_file=$SERVICE_ACCOUNT_FILE" >> $GITHUB_OUTPUT
          echo "configured=true" >> $GITHUB_OUTPUT

      #################################################
      # Deploy to Google Play Console
      #################################################
      - name: Deploy to Google Play Console
        if: ${{ steps.play_auth.outputs.configured == 'true' && inputs.package_name != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.play_auth.outputs.sa_file }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: release-bundle/**/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      #################################################
      # Play Store Deployment Step Summary
      #################################################
      - name: Generate Play Store Deploy Summary
        if: always()
        run: |
          echo "## 🛍️ Google Play Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Status / Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | \`${{ inputs.app_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Name** | \`${{ inputs.package_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.build-android.outputs.build_name }}+${{ needs.build-android.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Track & Status** | \`${{ inputs.track }}\` (${{ inputs.status }}) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.play_auth.outputs.configured }}" == "true" ]; then
            echo "| **Deploy Status** | ✅ **Berhasil Terupload ke Play Console** |" >> $GITHUB_STEP_SUMMARY
            echo "| **Play Console** | [Buka Google Play Console](https://play.google.com/console) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Deploy Status** | ⚠️ **Dilewati (Skipped)** - *Service Account JSON belum dikonfigurasi* |" >> $GITHUB_STEP_SUMMARY
          fi
