name: Swift iOS Multi-Module (SwiftUI) Build & TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      env_content:
        description: "Content to write to .env file (e.g. key=value lines)"
        required: false
        default: ""
        type: string
      app_name:
        description: "Application Name"
        required: true
        type: string
      workspace_or_project:
        description: "Path to .xcworkspace or .xcodeproj (empty for auto-detect)"
        required: false
        default: ""
        type: string
      scheme:
        description: "Xcode Scheme Name (empty for auto-detect or app_name)"
        required: false
        default: ""
        type: string
      configuration:
        description: "Xcode Build Configuration (Release / Debug)"
        required: false
        default: "Release"
        type: string
      runs_on:
        description: "macOS Runner (macos-latest, macos-14, or macos-15)"
        required: false
        default: "macos-latest"
        type: string
      enable_semantic_release:
        description: "Run Semantic Release for automated version tagging and GitHub release"
        required: false
        default: true
        type: boolean
      update_project_version:
        description: "Auto-bump MARKETING_VERSION and CURRENT_PROJECT_VERSION in project.pbxproj"
        required: false
        default: true
        type: boolean
      build_name:
        description: "App Version Name override (e.g. 1.0.0). Defaults to semantic release tag"
        required: false
        default: ""
        type: string
      build_number:
        description: "App Build Number override (integer). Defaults to github.run_number"
        required: false
        default: ""
        type: string
      build_args:
        description: "Additional xcodebuild arguments (e.g. -skipPackagePluginValidation)"
        required: false
        default: ""
        type: string
      upload_to_testflight:
        description: "Deploy to Apple TestFlight"
        required: false
        default: true
        type: boolean
      attach_to_release:
        description: "Attach IPA binary to GitHub Release"
        required: false
        default: true
        type: boolean
      uses_non_exempt_encryption:
        description: "Set ITSAppUsesNonExemptEncryption in Info.plist (false to automatically resolve TestFlight Missing Compliance)"
        required: false
        default: false
        type: boolean
      tag_prefix:
        description: "Git Tag Prefix for Monorepo (e.g. 'ios-')"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      env_content:
        description: "Content to write to .env file (e.g. key=value lines)"
        required: false
        default: ""
        type: string
      app_name:
        description: "Application Name"
        required: true
        type: string
      workspace_or_project:
        description: "Path to .xcworkspace or .xcodeproj (empty for auto-detect)"
        required: false
        default: ""
        type: string
      scheme:
        description: "Xcode Scheme Name (empty for auto-detect or app_name)"
        required: false
        default: ""
        type: string
      configuration:
        description: "Xcode Build Configuration (Release / Debug)"
        required: false
        default: "Release"
        type: string
      runs_on:
        description: "macOS Runner (macos-latest, macos-14, or macos-15)"
        required: false
        default: "macos-latest"
        type: string
      enable_semantic_release:
        description: "Run Semantic Release for automated version tagging and GitHub release"
        required: false
        default: true
        type: boolean
      update_project_version:
        description: "Auto-bump MARKETING_VERSION and CURRENT_PROJECT_VERSION in project.pbxproj"
        required: false
        default: true
        type: boolean
      build_name:
        description: "App Version Name override (e.g. 1.0.0). Defaults to semantic release tag"
        required: false
        default: ""
        type: string
      build_number:
        description: "App Build Number override (integer). Defaults to github.run_number"
        required: false
        default: ""
        type: string
      build_args:
        description: "Additional xcodebuild arguments (e.g. -skipPackagePluginValidation)"
        required: false
        default: ""
        type: string
      upload_to_testflight:
        description: "Deploy to Apple TestFlight"
        required: false
        default: true
        type: boolean
      attach_to_release:
        description: "Attach IPA binary to GitHub Release"
        required: false
        default: true
        type: boolean
      uses_non_exempt_encryption:
        description: "Set ITSAppUsesNonExemptEncryption in Info.plist (false to automatically resolve TestFlight Missing Compliance)"
        required: false
        default: false
        type: boolean
      tag_prefix:
        description: "Git Tag Prefix for Monorepo (e.g. 'ios-')"
        required: false
        default: ""
        type: string

    secrets:
      ENV_FILE:
        description: "Encrypted .env content from GitHub Secrets"
        required: false
      APPLE_CERTIFICATE_BASE64:
        description: "Apple Distribution Certificate (.p12) base64 encoded"
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        description: "Password for the .p12 certificate"
        required: true
      APPLE_PROVISIONING_PROFILE_BASE64:
        description: "Main Provisioning Profile (.mobileprovision) base64 encoded, or multiple profiles delimited by '---' or newlines"
        required: false
      APPLE_PROVISIONING_PROFILES_BASE64:
        description: "Multiple Apple Provisioning Profiles base64 encoded (delimited by '---', JSON array, or zip/tar)"
        required: false
      APPLE_PROVISIONING_PROFILE_WIDGET_BASE64:
        description: "Optional dedicated Provisioning Profile for Widget / Extension target base64 encoded"
        required: false
      APPLE_PROVISIONING_PROFILE_EXTENSION_BASE64:
        description: "Optional dedicated Provisioning Profile for additional Extension target base64 encoded"
        required: false
      APP_STORE_CONNECT_API_KEY_BASE64:
        description: "App Store Connect API Key (.p8) in base64 or plain text"
        required: false
      APP_STORE_CONNECT_KEY_ID:
        description: "App Store Connect API Key ID (10 characters)"
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        description: "App Store Connect Issuer ID (UUID)"
        required: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: deploy-ios-swiftui-multimodule-${{ inputs.app_name }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS Multi-Module IPA
    runs-on: ${{ inputs.runs_on }}
    outputs:
      build_name: ${{ steps.versioning.outputs.build_name }}
      build_number: ${{ steps.versioning.outputs.build_number }}
      release_tag: ${{ steps.versioning.outputs.release_tag }}
      export_profiles: ${{ steps.multi_signing.outputs.matched_profiles_summary }}

    steps:
      #################################################
      # Checkout Repository
      #################################################
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #################################################
      # Setup Node (Semantic Release)
      #################################################
      - name: Setup Node (Semantic Release)
        if: ${{ inputs.enable_semantic_release }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #################################################
      # Install Semantic Release
      #################################################
      - name: Install Semantic Release
        if: ${{ inputs.enable_semantic_release }}
        run: |
          npm install -D \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      #################################################
      # Run Semantic Release
      #################################################
      - name: Run Semantic Release
        if: ${{ inputs.enable_semantic_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.tag_prefix }}" ]; then
            npx semantic-release --tag-format "${{ inputs.tag_prefix }}v\${version}" || echo "Semantic release completed or skipped without new version."
          else
            npx semantic-release || echo "Semantic release completed or skipped without new version."
          fi

      #################################################
      # Setup Environment Configuration (.env)
      #################################################
      - name: Setup Environment Configuration (.env)
        env:
          ENV_CONTENT: ${{ inputs.env_content }}
          SECRET_ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$SECRET_ENV_CONTENT" ]; then
            echo "📄 Writing .env from secret ENV_FILE..."
            echo "$SECRET_ENV_CONTENT" > .env
          elif [ -n "$ENV_CONTENT" ]; then
            echo "📄 Writing .env from inputs.env_content..."
            echo "$ENV_CONTENT" > .env
          elif [ -f .env.example ]; then
            echo "📄 Writing .env from .env.example template..."
            cp .env.example .env
          else
            echo "📄 Creating empty .env placeholder..."
            touch .env
          fi

      #################################################
      # Setup Apple Certificate & Provisioning Profiles (Multi-Module)
      #################################################
      - name: Install Apple Certificate and Provisioning Profiles
        id: ios_signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PP_SINGLE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          PP_MULTI_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILES_BASE64 }}
          PP_WIDGET_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGET_BASE64 }}
          PP_EXTENSION_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_EXTENSION_BASE64 }}
          KEYCHAIN_PASSWORD: "ci-build-keychain-temporary-pass"
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ APPLE_CERTIFICATE_BASE64 secret is not provided."
            exit 1
          fi

          if [ -z "$PP_SINGLE_BASE64" ] && [ -z "$PP_MULTI_BASE64" ] && [ -z "$PP_WIDGET_BASE64" ] && [ -z "$PP_EXTENSION_BASE64" ]; then
            echo "❌ No Apple Provisioning Profiles provided in secrets!"
            echo "Please set APPLE_PROVISIONING_PROFILE_BASE64 or APPLE_PROVISIONING_PROFILES_BASE64."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILES_DIR="$RUNNER_TEMP/extracted_profiles"
          SYSTEM_PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILES_META_PATH="$RUNNER_TEMP/provisioning_profiles_meta.json"

          mkdir -p "$PROFILES_DIR"
          mkdir -p "$SYSTEM_PP_DIR"

          # 1. Decode & import Certificate to temporary keychain
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 2. Extract and parse all provisioning profiles with Python
          python3 - << 'EOF'
          import base64
          import io
          import json
          import os
          import plistlib
          import re
          import subprocess
          import sys
          import tarfile
          import zipfile

          runner_temp = os.environ.get('RUNNER_TEMP', '/tmp')
          profiles_dir = os.path.join(runner_temp, 'extracted_profiles')
          system_pp_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          meta_path = os.path.join(runner_temp, 'provisioning_profiles_meta.json')

          os.makedirs(profiles_dir, exist_ok=True)
          os.makedirs(system_pp_dir, exist_ok=True)

          raw_inputs = [
              os.environ.get('PP_SINGLE_BASE64', ''),
              os.environ.get('PP_MULTI_BASE64', ''),
              os.environ.get('PP_WIDGET_BASE64', ''),
              os.environ.get('PP_EXTENSION_BASE64', '')
          ]

          installed = []
          seen_uuids = set()

          def parse_profile_content(raw_bytes):
              # Try security cms decode first if on macOS
              try:
                  res = subprocess.run(['security', 'cms', '-D'], input=raw_bytes, capture_output=True, check=True)
                  return plistlib.loads(res.stdout)
              except Exception:
                  pass

              # Fallback: extract embedded XML plist via regex
              match = re.search(rb'<\?xml.*?</plist>', raw_bytes, re.DOTALL)
              if match:
                  try:
                      return plistlib.loads(match.group(0))
                  except Exception:
                      pass
              return None

          def register_profile(data):
              if not data:
                  return
              # Check for zip archive
              if data[:4] == b'PK\x03\x04':
                  try:
                      with zipfile.ZipFile(io.BytesIO(data)) as zf:
                          for name in zf.namelist():
                              if name.endswith('.mobileprovision') or not '.' in os.path.basename(name):
                                  register_profile(zf.read(name))
                      return
                  except Exception:
                      pass

              # Check for tar archive
              try:
                  with tarfile.open(fileobj=io.BytesIO(data)) as tf:
                      for member in tf.getmembers():
                          if member.isfile():
                              register_profile(tf.extractfile(member).read())
                      return
              except Exception:
                  pass

              plist_data = parse_profile_content(data)
              if not plist_data:
                  return

              uuid = str(plist_data.get('UUID', ''))
              name = str(plist_data.get('Name', ''))
              team_ids = plist_data.get('TeamIdentifier', [])
              team_id = str(team_ids[0]) if team_ids else ''
              entitlements = plist_data.get('Entitlements', {})
              app_id = str(entitlements.get('application-identifier', ''))

              if app_id.startswith(team_id + '.'):
                  bundle_id = app_id[len(team_id) + 1:]
              else:
                  bundle_id = app_id

              if not uuid:
                  uuid = f"profile-{len(installed) + 1}"

              if uuid in seen_uuids:
                  return
              seen_uuids.add(uuid)

              target_file = os.path.join(system_pp_dir, f"{uuid}.mobileprovision")
              with open(target_file, 'wb') as f:
                  f.write(data)

              installed.append({
                  'uuid': uuid,
                  'name': name,
                  'team_id': team_id,
                  'bundle_id': bundle_id,
                  'app_id': app_id,
                  'installed_path': target_file
              })

          for raw in raw_inputs:
              if not raw or not raw.strip():
                  continue
              raw_s = raw.strip()

              # Case 1: JSON array or dictionary
              if (raw_s.startswith('{') and raw_s.endswith('}')) or (raw_s.startswith('[') and raw_s.endswith(']')):
                  try:
                      parsed = json.loads(raw_s)
                      items = parsed if isinstance(parsed, list) else list(parsed.values())
                      for item in items:
                          try:
                              register_profile(base64.b64decode(item.strip()))
                          except Exception:
                              pass
                      continue
                  except Exception:
                      pass

              # Case 2: Delimited chunks ('---', double newline, or comma)
              chunks = []
              if '---' in raw_s:
                  chunks = re.split(r'-{3,}', raw_s)
              elif '\n\n' in raw_s:
                  chunks = raw_s.split('\n\n')
              elif ',' in raw_s and not raw_s.startswith('MII'):
                  chunks = raw_s.split(',')
              else:
                  chunks = [raw_s]

              for chunk in chunks:
                  chunk = chunk.strip()
                  if not chunk:
                      continue
                  try:
                      # Strip whitespace inside base64 string
                      decoded = base64.b64decode(re.sub(r'\s+', '', chunk))
                      register_profile(decoded)
                  except Exception as e:
                      pass

          if not installed:
              print("❌ Could not decode any valid Provisioning Profiles from secrets!")
              sys.exit(1)

          with open(meta_path, 'w') as f:
              json.dump(installed, f, indent=2)

          primary_team_id = installed[0]['team_id']
          print(f"🔑 Successfully installed {len(installed)} Provisioning Profile(s):")
          for idx, p in enumerate(installed, 1):
              print(f"  [{idx}] Profile Name : {p['name']}")
              print(f"      Bundle ID    : {p['bundle_id']}")
              print(f"      Team ID      : {p['team_id']}")
              print(f"      UUID         : {p['uuid']}")

          # Output to GitHub Actions
          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output:
              with open(github_output, 'a') as f:
                  f.write(f"team_id={primary_team_id}\n")
                  f.write(f"profiles_count={len(installed)}\n")
                  f.write(f"profiles_meta_path={meta_path}\n")
          EOF

          echo "✅ Certificate and Provisioning Profiles installed successfully."

      #################################################
      # Detect Xcode Project / Workspace & Scheme
      #################################################
      - name: Resolve Xcode Project and Scheme
        id: xcode_resolve
        run: |
          TARGET="${{ inputs.workspace_or_project }}"
          BUILD_FLAG=""

          if [ -n "$TARGET" ]; then
            if [[ "$TARGET" == *.xcworkspace ]]; then
              BUILD_FLAG="-workspace $TARGET"
            else
              BUILD_FLAG="-project $TARGET"
            fi
          else
            # Deteksi otomatis: utamakan .xcworkspace jika ada
            WS=$(find . -maxdepth 2 -name "*.xcworkspace" ! -path "*.xcodeproj/*" 2>/dev/null | head -n 1)
            if [ -n "$WS" ]; then
              BUILD_FLAG="-workspace $WS"
              TARGET="$WS"
              echo "🎯 Auto-detected Workspace: $WS"
            else
              PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" 2>/dev/null | head -n 1)
              if [ -n "$PROJ" ]; then
                BUILD_FLAG="-project $PROJ"
                TARGET="$PROJ"
                echo "🎯 Auto-detected Project: $PROJ"
              else
                echo "❌ No .xcworkspace or .xcodeproj found!"
                exit 1
              fi
            fi
          fi

          # Deteksi Scheme
          SCHEME="${{ inputs.scheme }}"
          if [ -z "$SCHEME" ]; then
            SCHEMES_LIST=$(xcodebuild $BUILD_FLAG -list -json 2>/dev/null | grep -A 20 '"schemes"' | tr -d '", []' | grep -v 'schemes' || echo "")
            # Cari yang match app_name atau ambil scheme pertama
            FIRST_SCHEME=$(echo "$SCHEMES_LIST" | head -n 1 | xargs)
            if [ -n "$FIRST_SCHEME" ]; then
              SCHEME="$FIRST_SCHEME"
            else
              SCHEME="${{ inputs.app_name }}"
            fi
            echo "🎯 Auto-detected Scheme: $SCHEME"
          fi

          echo "build_flag=$BUILD_FLAG" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "target_path=$TARGET" >> $GITHUB_OUTPUT

      #################################################
      # Resolve SPM & CocoaPods Dependencies
      #################################################
      - name: Resolve Dependencies (SPM & CocoaPods)
        run: |
          BUILD_FLAG="${{ steps.xcode_resolve.outputs.build_flag }}"
          SCHEME="${{ steps.xcode_resolve.outputs.scheme }}"

          # 1. CocoaPods jika ada Podfile
          if [ -f "Podfile" ]; then
            echo "📦 Running pod install..."
            pod install --repo-update || pod install
          fi

          # 2. SPM package dependencies
          echo "📦 Resolving Swift Package Manager dependencies..."
          xcodebuild -resolvePackageDependencies $BUILD_FLAG -scheme "$SCHEME" 2>/dev/null || true

      #################################################
      # Determine Version & Build Number
      #################################################
      - name: Calculate Version and Build Number
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true

          # 1. Version Name (Semver)
          if [ -n "${{ inputs.build_name }}" ]; then
            BUILD_NAME="${{ inputs.build_name }}"
          else
            if [ -n "${{ inputs.tag_prefix }}" ]; then
              RAW_TAG=$(git describe --tags --match "${{ inputs.tag_prefix }}v*" --abbrev=0 2>/dev/null || echo "")
              if [ -n "$RAW_TAG" ]; then
                PREFIX="${{ inputs.tag_prefix }}v"
                BUILD_NAME="${RAW_TAG#$PREFIX}"
              else
                BUILD_NAME="1.0.0"
              fi
            else
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -n "$LATEST_TAG" ]; then
                BUILD_NAME="${LATEST_TAG#v}"
              else
                BUILD_NAME="1.0.0"
              fi
            fi
          fi

          # 2. Version Code / Build Number (Integer)
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          TAG="${{ inputs.tag_prefix }}v${BUILD_NAME}"

          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "🚀 Build Name: $BUILD_NAME, Build Number: $BUILD_NUMBER, Release Tag: $TAG"

      #################################################
      # Auto-bump Xcode Project Version & Commit
      #################################################
      - name: Update Xcode Project Version and Commit
        if: ${{ inputs.update_project_version }}
        env:
          BUILD_NAME: ${{ steps.versioning.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_number }}
        run: |
          # Update version in all project.pbxproj files
          PBX_FILES=$(find . -name "project.pbxproj" 2>/dev/null)
          UPDATED=false

          for pbx in $PBX_FILES; do
            echo "📝 Updating MARKETING_VERSION and CURRENT_PROJECT_VERSION in $pbx..."
            sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${BUILD_NAME};/g" "$pbx"
            sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$pbx"
            UPDATED=true
          done

          if [ "$UPDATED" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            MODIFIED_PBX=$(git status --porcelain | grep "project\.pbxproj" | awk '{print $2}' || true)
            if [ -n "$MODIFIED_PBX" ]; then
              echo "📝 Committing updated Xcode project version: $MODIFIED_PBX"
              git add $MODIFIED_PBX
              git commit -m "chore(release): bump iOS version to ${BUILD_NAME} (${BUILD_NUMBER}) [skip ci]"

              BRANCH_NAME="${{ github.ref_name }}"
              if [ -n "$BRANCH_NAME" ]; then
                git pull --rebase origin "$BRANCH_NAME" 2>/dev/null || true
                git push origin HEAD:"$BRANCH_NAME" || echo "⚠️ Could not push to $BRANCH_NAME (branch may be protected), continuing build."
              fi
            else
              echo "ℹ️ project.pbxproj is already up-to-date (${BUILD_NAME} / ${BUILD_NUMBER})."
            fi
          fi

      #################################################
      # Configure iOS Export Compliance (Info.plist)
      #################################################
      - name: Configure iOS Export Compliance
        run: |
          PLISTS=$(find . -name "Info.plist" ! -path "*/Pods/*" ! -path "*/.build/*" 2>/dev/null)
          for plist in $PLISTS; do
            echo "🔐 Configuring ITSAppUsesNonExemptEncryption in $plist..."
            if plutil -extract ITSAppUsesNonExemptEncryption raw "$plist" >/dev/null 2>&1; then
              plutil -replace ITSAppUsesNonExemptEncryption -bool ${{ inputs.uses_non_exempt_encryption }} "$plist"
            else
              plutil -insert ITSAppUsesNonExemptEncryption -bool ${{ inputs.uses_non_exempt_encryption }} "$plist"
            fi
          done
          echo "✅ ITSAppUsesNonExemptEncryption set to ${{ inputs.uses_non_exempt_encryption }}"

      #################################################
      # Smart Multi-Module Signing & ExportOptions Setup
      #################################################
      - name: Configure Multi-Module Signing and ExportOptions
        id: multi_signing
        env:
          DEFAULT_TEAM_ID: ${{ steps.ios_signing.outputs.team_id }}
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os
          import plistlib
          import re
          import subprocess
          import sys

          runner_temp = os.environ.get('RUNNER_TEMP', '/tmp')
          meta_path = os.path.join(runner_temp, 'provisioning_profiles_meta.json')
          export_options_path = os.path.join(runner_temp, 'ExportOptions.plist')

          if not os.path.exists(meta_path):
              print(f"❌ Profiles metadata not found at {meta_path}!")
              sys.exit(1)

          with open(meta_path, 'r') as f:
              installed_profiles = json.load(f)

          profiles_by_bundle = {p['bundle_id']: p for p in installed_profiles}
          primary_team_id = os.environ.get('DEFAULT_TEAM_ID') or (installed_profiles[0]['team_id'] if installed_profiles else '')

          print(f"📋 Loaded {len(installed_profiles)} Provisioning Profile(s) for matching.")

          # Find all project.pbxproj files
          pbx_files = [p for p in glob.glob('**/project.pbxproj', recursive=True) if 'Pods/' not in p and '.build/' not in p]
          if not pbx_files:
              print("❌ No project.pbxproj found!")
              sys.exit(1)

          export_provisioning_profiles = {}
          summary_pairs = []

          def update_build_settings_text(block_content, profile_name, team_id):
              # Update CODE_SIGN_STYLE to Manual
              if re.search(r'CODE_SIGN_STYLE\s*=', block_content):
                  block_content = re.sub(r'CODE_SIGN_STYLE\s*=\s*[^;]+;', 'CODE_SIGN_STYLE = Manual;', block_content)
              else:
                  block_content = re.sub(r'(buildSettings\s*=\s*\{)', r'\1\n\t\t\t\tCODE_SIGN_STYLE = Manual;', block_content)

              # Update DEVELOPMENT_TEAM
              if team_id:
                  if re.search(r'DEVELOPMENT_TEAM\s*=', block_content):
                      block_content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', f'DEVELOPMENT_TEAM = {team_id};', block_content)
                  else:
                      block_content = re.sub(r'(buildSettings\s*=\s*\{)', rf'\1\n\t\t\t\tDEVELOPMENT_TEAM = {team_id};', block_content)

              # Update PROVISIONING_PROFILE_SPECIFIER
              if re.search(r'PROVISIONING_PROFILE_SPECIFIER\s*=', block_content):
                  block_content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;', f'PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";', block_content)
              else:
                  block_content = re.sub(r'(buildSettings\s*=\s*\{)', rf'\1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";', block_content)

              # Update CODE_SIGN_IDENTITY
              if re.search(r'CODE_SIGN_IDENTITY\s*=', block_content):
                  block_content = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*[^;]+;', 'CODE_SIGN_IDENTITY = "Apple Distribution";', block_content)
              else:
                  block_content = re.sub(r'(buildSettings\s*=\s*\{)', r'\1\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";', block_content)

              return block_content

          for pbx_path in pbx_files:
              print(f"\n🔍 Analyzing Xcode project: {pbx_path}")
              # Convert pbxproj to JSON in memory to inspect AST
              try:
                  res = subprocess.run(['plutil', '-convert', 'json', '-o', '-', pbx_path], capture_output=True, text=True, check=True)
                  pbx_json = json.loads(res.stdout)
              except Exception as e:
                  print(f"⚠️ Could not parse {pbx_path} with plutil: {e}")
                  continue

              objects = pbx_json.get('objects', {})
              cfg_to_profile = {}

              for obj_id, obj in objects.items():
                  if obj.get('isa') != 'PBXNativeTarget':
                      continue

                  target_name = obj.get('name', 'UnknownTarget')
                  product_type = obj.get('productType', '')
                  cfg_list_id = obj.get('buildConfigurationList')
                  cfg_list = objects.get(cfg_list_id, {})
                  cfg_ids = cfg_list.get('buildConfigurations', [])

                  # Skip test targets
                  if 'unit-test' in product_type or 'ui-testing' in product_type:
                      print(f"  ⏭️ Skipping test target: '{target_name}' ({product_type})")
                      continue

                  # Determine target's bundle identifier
                  bundle_id = None
                  for cid in cfg_ids:
                      b = objects.get(cid, {}).get('buildSettings', {}).get('PRODUCT_BUNDLE_IDENTIFIER')
                      if b and not b.startswith('$('):
                          bundle_id = b
                          break

                  # Fallback: check Info.plist of target if bundle_id contains variable or is missing
                  if not bundle_id or '$' in bundle_id:
                      for cid in cfg_ids:
                          plist_rel = objects.get(cid, {}).get('buildSettings', {}).get('INFOPLIST_FILE')
                          if plist_rel and not plist_rel.startswith('$('):
                              plist_path = os.path.join(os.path.dirname(os.path.dirname(pbx_path)), plist_rel)
                              if os.path.exists(plist_path):
                                  try:
                                      with open(plist_path, 'rb') as pf:
                                          p_data = plistlib.load(pf)
                                          cb_id = p_data.get('CFBundleIdentifier')
                                          if cb_id and not cb_id.startswith('$('):
                                              bundle_id = cb_id
                                              break
                                  except Exception:
                                      pass

                  # Match with available profiles
                  matched_profile = None

                  # 1. Exact match on bundle ID
                  if bundle_id and bundle_id in profiles_by_bundle:
                      matched_profile = profiles_by_bundle[bundle_id]

                  # 2. Wildcard match on bundle ID
                  if not matched_profile and bundle_id:
                      for p_bundle, p_info in profiles_by_bundle.items():
                          if p_bundle == '*' or (p_bundle.endswith('*') and bundle_id.startswith(p_bundle[:-1])):
                              matched_profile = p_info
                              break

                  # 3. Target name or widget keyword match
                  if not matched_profile:
                      t_lower = target_name.lower()
                      for p in installed_profiles:
                          p_bundle_lower = p['bundle_id'].lower()
                          p_name_lower = p['name'].lower()
                          if (t_lower in p_bundle_lower or t_lower in p_name_lower or
                              ('widget' in t_lower and 'widget' in p_bundle_lower) or
                              ('extension' in t_lower and 'extension' in p_bundle_lower)):
                              matched_profile = p
                              break

                  # 4. Fallback if single profile and main application target
                  if not matched_profile and len(installed_profiles) == 1 and 'application' in product_type:
                      matched_profile = installed_profiles[0]

                  if matched_profile:
                      eff_bundle_id = bundle_id or matched_profile['bundle_id']
                      team_id = matched_profile['team_id'] or primary_team_id
                      print(f"  🎯 Target '{target_name}' [{eff_bundle_id}] -> Matched Profile: '{matched_profile['name']}' (Team: {team_id})")

                      export_provisioning_profiles[eff_bundle_id] = matched_profile['name']
                      summary_pairs.append(f"{target_name}: {eff_bundle_id} -> {matched_profile['name']}")

                      for cid in cfg_ids:
                          cfg_to_profile[cid] = (matched_profile['name'], team_id)
                  else:
                      print(f"  ⚠️ Warning: No matching profile found for target '{target_name}' (Bundle ID: {bundle_id})")

              # Apply updates to pbxproj text preserving comments & structure
              if cfg_to_profile:
                  with open(pbx_path, 'r', encoding='utf-8', errors='ignore') as f:
                      pbx_text = f.read()

                  pattern = r'(\b[0-9A-Za-z_]+\b)(?:\s*/\*.*?\*/)?\s*=\s*\{\s*isa\s*=\s*XCBuildConfiguration;[\s\S]*?\n\t*\};'

                  def replace_cfg_block(m):
                      cid = m.group(1)
                      if cid in cfg_to_profile:
                          prof_name, prof_team = cfg_to_profile[cid]
                          return update_build_settings_text(m.group(0), prof_name, prof_team)
                      return m.group(0)

                  updated_pbx = re.sub(pattern, replace_cfg_block, pbx_text)
                  with open(pbx_path, 'w', encoding='utf-8') as f:
                      f.write(updated_pbx)
                  print(f"  ✅ Updated signing configurations in {pbx_path}")

          # If no bundle ID was extracted but profiles exist, add all profiles to export dictionary
          if not export_provisioning_profiles:
              print("⚠️ Fallback: Adding all installed profiles directly to ExportOptions...")
              for p in installed_profiles:
                  if p['bundle_id'] and p['bundle_id'] != '*':
                      export_provisioning_profiles[p['bundle_id']] = p['name']

          # Generate ExportOptions.plist
          export_options_data = {
              'method': 'app-store',
              'signingStyle': 'manual',
              'teamID': primary_team_id,
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': export_provisioning_profiles,
              'destination': 'export',
              'manageAppVersionAndBuildNumber': False
          }

          with open(export_options_path, 'wb') as f:
              plistlib.dump(export_options_data, f)

          print("\n📄 Generated ExportOptions.plist:")
          with open(export_options_path, 'rb') as f:
              print(f.read().decode('utf-8'))

          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output:
              with open(github_output, 'a') as f:
                  f.write(f"export_options={export_options_path}\n")
                  f.write(f"team_id={primary_team_id}\n")
                  f.write(f"matched_profiles_summary={'; '.join(summary_pairs)}\n")
          EOF

      #################################################
      # Build Xcode Archive
      #################################################
      - name: Build Xcode Archive (.xcarchive)
        env:
          TEAM_ID: ${{ steps.ios_signing.outputs.team_id }}
          BUILD_FLAG: ${{ steps.xcode_resolve.outputs.build_flag }}
          SCHEME: ${{ steps.xcode_resolve.outputs.scheme }}
        run: |
          mkdir -p build/ios

          echo "🔨 Archiving with scheme: $SCHEME, config: ${{ inputs.configuration }}..."
          xcodebuild archive \
            $BUILD_FLAG \
            -scheme "$SCHEME" \
            -configuration "${{ inputs.configuration }}" \
            -archivePath "build/ios/${{ inputs.app_name }}.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            ${{ inputs.build_args }}

      #################################################
      # Export IPA from Archive
      #################################################
      - name: Export IPA from Archive
        run: |
          EXPORT_OPTIONS="${{ steps.multi_signing.outputs.export_options }}"
          mkdir -p build/ios/ipa

          echo "📦 Exporting IPA using $EXPORT_OPTIONS..."
          xcodebuild -exportArchive \
            -archivePath "build/ios/${{ inputs.app_name }}.xcarchive" \
            -exportPath "build/ios/ipa" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      #################################################
      # Upload Artifact to GitHub Actions
      #################################################
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-v${{ steps.versioning.outputs.build_name }}-${{ steps.versioning.outputs.build_number }}-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      #################################################
      # Attach IPA to GitHub Release
      #################################################
      - name: Attach IPA to GitHub Release
        if: ${{ inputs.attach_to_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.release_tag }}"
          echo "🏷️ Target Release Tag: $TAG"

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            NAMED_IPA="build/ios/ipa/${{ inputs.app_name }}-v${{ steps.versioning.outputs.build_name }}-${{ steps.versioning.outputs.build_number }}.ipa"
            if [ "$IPA_FILE" != "$NAMED_IPA" ]; then
              cp "$IPA_FILE" "$NAMED_IPA"
            fi

            echo "📦 Menyiapkan upload file IPA: $NAMED_IPA"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "✅ GitHub Release $TAG ditemukan. Mengupload IPA..."
              gh release upload "$TAG" "$NAMED_IPA" --clobber
            else
              echo "ℹ️ Release $TAG belum ada di GitHub. Membuat release baru..."
              gh release create "$TAG" "$NAMED_IPA" \
                --title "${{ inputs.app_name }} $TAG" \
                --notes "Automated release build for ${{ inputs.app_name }} $TAG (Multi-Module)" || true
            fi
          else
            echo "ℹ️ Tidak ada file IPA yang ditemukan untuk di-upload."
          fi

      #################################################
      # Build Step Summary
      #################################################
      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🔨 Swift iOS Multi-Module (SwiftUI) Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | \`${{ inputs.app_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scheme** | \`${{ steps.xcode_resolve.outputs.scheme }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`${{ steps.versioning.outputs.build_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Number** | \`${{ steps.versioning.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Profiles Count** | \`${{ steps.ios_signing.outputs.profiles_count }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Matched Modules** | \`${{ steps.multi_signing.outputs.matched_profiles_summary }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Export Compliance** | \`ITSAppUsesNonExemptEncryption=${{ inputs.uses_non_exempt_encryption }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Direct Download IPA** | [📦 Download IPA via GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.versioning.outputs.release_tag }}) |" >> $GITHUB_STEP_SUMMARY

      #################################################
      # Clean up Keychain
      #################################################
      - name: Clean up Keychain and Provisioning Profiles
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true

  deploy-testflight:
    name: Deploy to Apple TestFlight
    needs: build-ios
    if: ${{ inputs.upload_to_testflight }}
    runs-on: ${{ inputs.runs_on }}

    steps:
      #################################################
      # Download IPA Artifact
      #################################################
      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_name }}-v${{ needs.build-ios.outputs.build_name }}-${{ needs.build-ios.outputs.build_number }}-ipa
          path: build/ios/ipa

      #################################################
      # Find Built IPA Path
      #################################################
      - name: Find Built IPA Path
        id: find_ipa
        run: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ No .ipa file found in build/ios/ipa/"
            exit 1
          fi
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "📦 Found IPA: $IPA_FILE"

      #################################################
      # Prepare App Store Connect Key
      #################################################
      - name: Prepare App Store Connect Key
        id: asc_key
        env:
          RAW_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$RAW_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "⚠️ App Store Connect credentials not fully configured. Skipping TestFlight deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$RAW_KEY" | grep -q "BEGIN"; then
            DECODED="$RAW_KEY"
          else
            DECODED=$(echo "$RAW_KEY" | base64 --decode)
          fi

          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$DECODED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "configured=true" >> $GITHUB_OUTPUT

      #################################################
      # Deploy to TestFlight
      #################################################
      - name: Deploy to TestFlight
        if: ${{ steps.asc_key.outputs.configured == 'true' }}
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ steps.asc_key.outputs.key }}

      #################################################
      # Deployment Step Summary
      #################################################
      - name: Generate TestFlight Deploy Summary
        if: always()
        run: |
          echo "## 🍏 TestFlight Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Status / Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | \`${{ inputs.app_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version & Build** | \`${{ needs.build-ios.outputs.build_name }}+${{ needs.build-ios.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.asc_key.outputs.configured }}" == "true" ]; then
            echo "| **Upload Status** | ✅ **Berhasil Terupload ke TestFlight** |" >> $GITHUB_STEP_SUMMARY
            echo "| **App Store Console** | [Buka TestFlight Console](https://appstoreconnect.apple.com) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⏱️ **Info Apple Processing:** Setelah upload berhasil, Apple membutuhkan waktu **5 - 15 menit** untuk memproses binary sebelum build muncul di daftar aktif TestFlight." >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Upload Status** | ⚠️ **Dilewati (Skipped)** - *Secrets API Key App Store Connect belum lengkap* |" >> $GITHUB_STEP_SUMMARY
          fi
